name: Build and Release CrabMC

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: crabmc-server
            artifact_name: crabmc-server-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: crabmc-server
            artifact_name: crabmc-server-linux-aarch64
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: crabmc-server.exe
            artifact_name: crabmc-server-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: crabmc-server
            artifact_name: crabmc-server-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: crabmc-server
            artifact_name: crabmc-server-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/${{ matrix.artifact_name }}
            chmod +x staging/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List Artifacts
        run: |
          find release-artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/**/*
          name: CrabMC Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🦀 CrabMC Server Release
            High-performance Minecraft Server written in Rust (PaperMC-inspired architecture).

            ### 🚀 Highlights
            - **Native Blazing-Fast Performance**: Zero JVM overhead, instant startup, minimal RAM.
            - **PaperMC Compatible Configuration**: Full `server.properties` parsing and default generation.
            - **Minecraft 1.20.4 Support**: Handshake, Server List Ping (SLP), and Login flow.
            - **Plugin Framework**: Modular extensible plugin architecture.

            ### 📦 Binaries
            Download the binary for your platform, make it executable (`chmod +x crabmc-server*` on Linux/macOS), and run!
