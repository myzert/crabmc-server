[package]
name = "crabmc-server"
version = "0.1.0"
edition = "2021"
authors = ["myzert <zerttcihuy@gmail.com>"]
description = "High-performance Minecraft Server written in Rust inspired by PaperMC"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
bytes = "1.6"
anyhow = "1.0"
thiserror = "1.0"
